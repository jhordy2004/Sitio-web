<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg-grad-VOL-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf6ea" />
      <stop offset="100%" stop-color="#dce5d9" />
    </linearGradient>
    <pattern id="puntos-VOL-02" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#161d16" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Fondo base con screentone -->
  <rect width="400" height="600" fill="url(#bg-grad-VOL-02)" stroke="#161d16" stroke-width="4" />
  <rect width="400" height="600" fill="url(#puntos-VOL-02)" />

  <!-- Marco de panel estilo manga -->
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#161d16" stroke-width="2" />
  <rect x="22" y="22" width="356" height="556" fill="none" stroke="#161d16" stroke-width="1" stroke-dasharray="4,2" opacity="0.5" />

  <!-- Cabecera de la editorial y volumen -->
  <rect x="20" y="20" width="360" height="52" fill="#161d16" />
  <text x="34" y="54" font-family="'Anton', Impact, sans-serif" font-size="24" fill="#f3fcf0" letter-spacing="2">MANGA VOID COMICS</text>
  <rect x="295" y="28" width="75" height="36" fill="#b7102a" />
  <text x="332" y="53" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. 02</text>

  <!-- Etiqueta de estado -->
  <g transform="translate(34, 86)">
    <rect width="80" height="26" fill="#286182" stroke="#161d16" stroke-width="2" />
    <text x="40" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NUEVO</text>
  </g>

  <!-- Demografia -->
  <text x="360" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5b403f" text-anchor="end" letter-spacing="1">[SHOJO]</text>

  <!-- Ilustracion central -->
  <g transform="translate(50, 130)">
    <circle cx="150" cy="130" r="70" fill="none" stroke="#286182" stroke-width="5" stroke-dasharray="14,8"/><circle cx="150" cy="130" r="45" fill="none" stroke="#b7102a" stroke-width="3"/><polygon points="150,90 162,120 195,120 168,140 178,170 150,150 122,170 132,140 105,120 138,120" fill="#161d16"/><text x="150" y="275" font-family="Hanken Grotesk" font-size="14" font-weight="bold" fill="#286182" text-anchor="middle">ORBITAL ROMANCE SAGA</text>
  </g>

  <!-- Bloque inferior con titulo y autor -->
  <rect x="20" y="460" width="360" height="118" fill="#ffffff" stroke="#161d16" stroke-width="2" />
  <rect x="20" y="460" width="8" height="118" fill="#b7102a" />
  
  <text x="38" y="502" font-family="'Anton', Impact, sans-serif" font-size="30" fill="#161d16" letter-spacing="0.5">VÓRTICE ESTELAR</text>
  <text x="38" y="532" font-family="'Hanken Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#5b403f">Guion y Arte: Elena Fujiwara</text>
  <text x="38" y="558" font-family="'JetBrains Mono', monospace" font-size="12" fill="#161d16" opacity="0.7">ISBN 978-9942-01-7395 · EDICIÓN OFICIAL</text>
  
  <!-- Sello de autenticidad Void -->
  <circle cx="340" cy="519" r="26" fill="#f3fcf0" stroke="#b7102a" stroke-width="2" />
  <text x="340" y="515" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#b7102a" text-anchor="middle">VOID</text>
  <text x="340" y="527" font-family="'JetBrains Mono', monospace" font-size="7" fill="#161d16" text-anchor="middle">OFICIAL</text>
</svg>