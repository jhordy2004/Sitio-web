<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg-grad-VOL-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3fcf0" />
      <stop offset="100%" stop-color="#e7f0e5" />
    </linearGradient>
    <pattern id="puntos-VOL-01" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#161d16" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Fondo base con screentone -->
  <rect width="400" height="600" fill="url(#bg-grad-VOL-01)" stroke="#161d16" stroke-width="4" />
  <rect width="400" height="600" fill="url(#puntos-VOL-01)" />

  <!-- Marco de panel estilo manga -->
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#161d16" stroke-width="2" />
  <rect x="22" y="22" width="356" height="556" fill="none" stroke="#161d16" stroke-width="1" stroke-dasharray="4,2" opacity="0.5" />

  <!-- Cabecera de la editorial y volumen -->
  <rect x="20" y="20" width="360" height="52" fill="#161d16" />
  <text x="34" y="54" font-family="'Anton', Impact, sans-serif" font-size="24" fill="#f3fcf0" letter-spacing="2">MANGA VOID COMICS</text>
  <rect x="295" y="28" width="75" height="36" fill="#b7102a" />
  <text x="332" y="53" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. 01</text>

  <!-- Etiqueta de estado -->
  <g transform="translate(34, 86)">
    <rect width="80" height="26" fill="#b7102a" stroke="#161d16" stroke-width="2" />
    <text x="40" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ESPECIAL</text>
  </g>

  <!-- Demografia -->
  <text x="360" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5b403f" text-anchor="end" letter-spacing="1">[SEINEN]</text>

  <!-- Ilustracion central -->
  <g transform="translate(50, 130)">
    
  <circle cx="150" cy="150" r="120" fill="#161d16" />
  <circle cx="150" cy="150" r="95" fill="none" stroke="#b7102a" stroke-width="8" stroke-dasharray="12,6" />
  <polygon points="150,40 185,130 275,150 185,170 150,260 115,170 25,150 115,130" fill="#b7102a" />
  <circle cx="150" cy="150" r="35" fill="#f3fcf0" />
  <path d="M100 240 L200 60" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <text x="150" y="290" font-family="'Anton', Impact, sans-serif" font-size="20" fill="#161d16" text-anchor="middle" letter-spacing="3">SHINJUKU ARC SPECIAL</text>

  </g>

  <!-- Bloque inferior con titulo y autor -->
  <rect x="20" y="460" width="360" height="118" fill="#ffffff" stroke="#161d16" stroke-width="2" />
  <rect x="20" y="460" width="8" height="118" fill="#b7102a" />
  
  <text x="38" y="502" font-family="'Anton', Impact, sans-serif" font-size="30" fill="#161d16" letter-spacing="0.5">CRÓNICAS DEL VACÍO</text>
  <text x="38" y="532" font-family="'Hanken Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#5b403f">Guion y Arte: Kenjiro Sato</text>
  <text x="38" y="558" font-family="'JetBrains Mono', monospace" font-size="12" fill="#161d16" opacity="0.7">ISBN 978-9942-01-4327 · EDICIÓN OFICIAL</text>
  
  <!-- Sello de autenticidad Void -->
  <circle cx="340" cy="519" r="26" fill="#f3fcf0" stroke="#b7102a" stroke-width="2" />
  <text x="340" y="515" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#b7102a" text-anchor="middle">VOID</text>
  <text x="340" y="527" font-family="'JetBrains Mono', monospace" font-size="7" fill="#161d16" text-anchor="middle">OFICIAL</text>
</svg>